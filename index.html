<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25_Art_Em_Meio - Realidade Aumentada</title>
    
    <!-- Importação do A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Importação do MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

   <!-- NOVO: Script personalizado corrigido com delay de 1ms -->
    <script>
      AFRAME.registerComponent('atrasar-ocultacao', {
        schema: {
          tempo: { type: 'number', default: 3000 } 
        },
        init: function () {
          let temporizador = null;
          
          this.el.addEventListener('targetFound', () => {
            clearTimeout(temporizador);
            // Garante que fique visível quando encontra, sobrepondo o MindAR
            setTimeout(() => {
              this.el.object3D.visible = true;
            }, 1);
          });

          this.el.addEventListener('targetLost', () => {
            // Este atraso de 1ms é o "pulo do gato". Ele espera o MindAR tentar 
            // esconder o objeto, e imediatamente manda mostrar de novo.
            setTimeout(() => {
              this.el.object3D.visible = true;
            }, 1);
            
            // Inicia a contagem real de 5000ms que você definiu no HTML. 
            // Quando o tempo acabar, esconde tudo definitivamente.
            temporizador = setTimeout(() => {
              this.el.object3D.visible = false;
            }, this.data.tempo);
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="florAsset" src="./flor.png" />
        <!-- NOVO: Apontando para o seu arquivo .glb -->
        <!-- <a-asset-item id="terrenoGLB" src="./vale_low_poly.glb"></a-asset-item> -->
        <a-asset-item id="passfloraGLB" src="./25ArtFlor_passflora_003 decimate COR.glb"></a-asset-item>
        <a-asset-item id="hibisco_wireGLB" src="./25ArtFlor_hibisco_009_decimate_wireframe_join_achatado.glb"></a-asset-item>
        <a-asset-item id="quaresmeiraGLB" src="./quaresmeira 009 cor_01.glb"></a-asset-item>
        <a-asset-item id="paisagemGLB" src="./25Art_paisagem_SacraFamilia_Tingua_016a_decimate_wireframe.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 
        NOVO: Adicionamos o atributo atrasar-ocultacao="tempo: 3000" na entidade.
        Isso conecta o script que criamos lá em cima a este agrupamento 3D.
        -->
      <a-entity mindar-image-target="targetIndex: 0" atrasar-ocultacao="tempo: 3000">
        
        <!-- A imagem 2D projetada -->
        <!--
        <a-image 
          src="#florAsset" 
          position="0 0 0" 
          height="1" 
          width="1" 
          rotation="0 0 0">
        </a-image>
        -->

        <!-- 
          NOVO: O Modelo 3D em GLB usando gltf-model 
          O atributo material foi removido, pois o .glb já possui suas próprias cores e materiais.
        -->
        <!-->
        <a-entity 
          gltf-model="#terrenoGLB" 
          position="0 0 0.9" 
          scale="0.3 0.3 0.3" 
          rotation="0 0 0">
        </a-entity>
        -->

         <a-entity
          gltf-model="#paisagemGLB"
          position="0 0 0.5"
          scale="0.001 0.001 0.001"
          rotation="90 0 0">
        </a-entity>
        
        <a-entity
          gltf-model="#passfloraGLB"
          position="0 -0.5 1"
          scale="0.003 0.003 0.003"
          rotation="90 0 0">
        </a-entity>

        <a-entity
          gltf-model="#hibisco_wireGLB"
          position="0 0 1"
          scale="0.1 0.1 0.1"
          rotation="90 0 0">
        </a-entity>

        <a-entity
          gltf-model="#quaresmeiraGLB"
          position="0 -1 1"
          scale="0.1 0.1 0.1"
          rotation="90 0 0">
        </a-entity>


     <!-- Texto com acentos e fonte DejaVu -->
        <a-text
          value="O Vale do Café foi o maior produtor\nmundial de café no século XIX.\nSuas fazendas coloniais narram a grandiosidade\ne as contradições do Brasil Império.\nHoje, é um polo turístico de história e cultura."
          font="dejavu"
          color="blue"
          position="0 -0.7 0.2"
          align="center"
          width="2"
          wrap-count="35"
        >
        </a-text>

      </a-entity>

    </a-scene>

  </body>
</html>
