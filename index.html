<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25_Art_Em_Meio - Realidade Aumentada</title>
    
    <!-- Importação do A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Importação do MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="florAsset" src="./flor.png" />
        <!-- NOVO: Apontando para o seu arquivo .glb -->
        <a-asset-item id="meuModeloGLB" src="./vale_low_poly.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- A imagem 2D projetada -->
        <a-image 
          src="#florAsset" 
          position="0 0 0" 
          height="1" 
          width="1" 
          rotation="0 0 0">
        </a-image>

        <!-- 
          NOVO: O Modelo 3D em GLB usando gltf-model 
          O atributo material foi removido, pois o .glb já possui suas próprias cores e materiais.
        -->
        <a-entity 
          gltf-model="#meuModeloGLB" 
          position="0 0 0.9" 
          scale="0.3 0.3 0.3" 
          rotation="0 0 0">
        </a-entity>

     <!-- Texto com acentos e fonte DejaVu -->
        <a-text
          value="O Vale do Café foi o maior produtor\nmundial de café no século XIX.\nSuas fazendas coloniais narram a grandiosidade\ne as contradições do Brasil Império.\nHoje, é um polo turístico de história e cultura."
          font="dejavu"
          color="blue"
          position="0 -0.7 0.2"
          align="center"
          width="2"
          wrap-count="35"
        >
        </a-text>

      </a-entity>

    </a-scene>

  </body>
</html>
