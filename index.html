<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25_Art_Em_Meio - Realidade Aumentada</title>
    
    <!-- Importação do A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Importação do MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

   <!-- NOVO: Script personalizado corrigido com delay de 1ms -->
    <script>
      AFRAME.registerComponent('atrasar-ocultacao', {
        schema: {
          tempo: { type: 'number', default: 3000 } 
        },
        init: function () {
          let temporizador = null;
          
          this.el.addEventListener('targetFound', () => {
            clearTimeout(temporizador);
            // Garante que fique visível quando encontra, sobrepondo o MindAR
            setTimeout(() => {
              this.el.object3D.visible = true;
            }, 1);
          });

          this.el.addEventListener('targetLost', () => {
            // Este atraso de 1ms é o "pulo do gato". Ele espera o MindAR tentar 
            // esconder o objeto, e imediatamente manda mostrar de novo.
            setTimeout(() => {
              this.el.object3D.visible = true;
            }, 1);
            
            // Inicia a contagem real de 5000ms que você definiu no HTML. 
            // Quando o tempo acabar, esconde tudo definitivamente.
            temporizador = setTimeout(() => {
              this.el.object3D.visible = false;
            }, this.data.tempo);
          });
        }
      });
    </script>

<!-- NOVO SCRIPT: Rotação por Toque (Dois Eixos - Horizontal e Vertical) -->
    <script>
      AFRAME.registerComponent('rotacao-toque', {
        schema: {
          velocidade: { type: 'number', default: 0.5 },
          // Define qual eixo 3D gira quando o dedo move para os lados
          eixoHorizontal: { type: 'string', default: 'z' }, 
          // Define qual eixo 3D gira quando o dedo move para cima/baixo
          eixoVertical: { type: 'string', default: 'x' }    
        },
        init: function () {
          this.isDragging = false;
          this.previousX = 0;
          this.previousY = 0; // Variável para guardar a posição Y do dedo

          this.onPointerDown = this.onPointerDown.bind(this);
          this.onPointerMove = this.onPointerMove.bind(this);
          this.onPointerUp = this.onPointerUp.bind(this);

          window.addEventListener('mousedown', this.onPointerDown);
          window.addEventListener('touchstart', this.onPointerDown, { passive: true });
          
          window.addEventListener('mousemove', this.onPointerMove);
          window.addEventListener('touchmove', this.onPointerMove, { passive: true });
          
          window.addEventListener('mouseup', this.onPointerUp);
          window.addEventListener('touchend', this.onPointerUp);
        },
        onPointerDown: function (event) {
          this.isDragging = true;
          this.previousX = event.type.includes('touch') ? event.touches[0].clientX : event.clientX;
          this.previousY = event.type.includes('touch') ? event.touches[0].clientY : event.clientY;
        },
        onPointerMove: function (event) {
          if (!this.isDragging) return;

          // Pega as posições X e Y atuais do dedo/mouse
          let currentX = event.type.includes('touch') ? event.touches[0].clientX : event.clientX;
          let currentY = event.type.includes('touch') ? event.touches[0].clientY : event.clientY;
          
          // Calcula a diferença de movimento
          let deltaX = currentX - this.previousX;
          let deltaY = currentY - this.previousY;

          let rot = this.el.getAttribute('rotation');
          
          // 1. Aplica a rotação do arraste horizontal
          if (this.data.eixoHorizontal === 'x') rot.x += deltaX * this.data.velocidade;
          else if (this.data.eixoHorizontal === 'y') rot.y += deltaX * this.data.velocidade;
          else if (this.data.eixoHorizontal === 'z') rot.z += deltaX * this.data.velocidade;

          // 2. Aplica a rotação do arraste vertical
          // Nota: Pode ser necessário multiplicar deltaY por -1 dependendo se a inclinação 
          // parecer "invertida" em relação ao movimento do seu dedo.
          if (this.data.eixoVertical === 'x') rot.x += deltaY * this.data.velocidade;
          else if (this.data.eixoVertical === 'y') rot.y += deltaY * this.data.velocidade;
          else if (this.data.eixoVertical === 'z') rot.z += deltaY * this.data.velocidade;

          this.el.setAttribute('rotation', rot);

          // Atualiza as posições anteriores para o próximo quadro
          this.previousX = currentX;
          this.previousY = currentY;
        },
        onPointerUp: function () {
          this.isDragging = false;
        },
        remove: function () {
          window.removeEventListener('mousedown', this.onPointerDown);
          window.removeEventListener('touchstart', this.onPointerDown);
          window.removeEventListener('mousemove', this.onPointerMove);
          window.removeEventListener('touchmove', this.onPointerMove);
          window.removeEventListener('mouseup', this.onPointerUp);
          window.removeEventListener('touchend', this.onPointerUp);
        }
      });
    </script>

    <!-- NOVO SCRIPT: Tocar áudio no primeiro toque -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const audio = document.getElementById("audioFundo");
        
        // Função que tenta tocar o áudio
        const iniciarAudio = () => {
          if (audio.paused) {
            audio.play().catch(error => {
              console.log("O navegador bloqueou o áudio. Esperando interação.");
            });
          }
        };

        // Dispara no clique do mouse (PC) ou no toque (Celular)
        window.addEventListener('click', iniciarAudio, { once: true });
        window.addEventListener('touchstart', iniciarAudio, { once: true });
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- NOVO: Tag de áudio (o arquivo deve estar na sua pasta do projeto) -->
    <audio id="audioFundo" src="./objetos/passarinho_e_chuva.mp3" loop preload="auto"></audio>

    <a-scene 
      mindar-image="imageTargetSrc: ./marcadores/targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="relevoGLB" src="./objetos/vale_do_cafe.glb"></a-asset-item> <!-- Colocando o relevo do vale do café -->
        <a-asset-item id="bouganvilleGLB" src="./objetos/bouganville.glb"></a-asset-item> <!-- Colocando o objeto bouganville -->
        <a-asset-item id="ipeGLB" src="./objetos/ipe.glb"></a-asset-item> <!-- Colocando o objeto ipe -->
        <a-asset-item id="quaresmeiraGLB" src="./objetos/quaresmeira.glb"></a-asset-item> <!-- Colocando o objeto quaresmeira -->
        <a-asset-item id="pata_de_vacaGLB" src="./objetos/pata_de_vaca.glb"></a-asset-item> <!-- Colocando o objeto pata de vaca -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 2" atrasar-ocultacao="tempo: 3000"> <!-- Marcador 2 -->
       <a-entity
          gltf-model="#relevoGLB"
          rotacao-toque="eixoHorizontal: z; eixoVertical: x; velocidade: 0.8"
          position="0 0 0.1"
          scale="0.005 0.005 0.005"
          rotation="30 0 0">
        </a-entity>
      </a-entity>


      <a-entity mindar-image-target="targetIndex: 0" atrasar-ocultacao="tempo: 3000"> <!-- Marcador 0 -->
       <a-entity
          gltf-model="#bouganvilleGLB"
          rotacao-toque="eixoHorizontal: z; eixoVertical: x; velocidade: 0.8"
          position="0.7 0.7 0.1"
          scale="0.5 0.5 0.5"
          rotation="30 0 0">
        </a-entity>
        <a-entity
          gltf-model="#ipeGLB"
          rotacao-toque="eixoHorizontal: z; eixoVertical: x; velocidade: 0.8"
          position="-0.7 -0.7 0.1"
          scale="0.5 0.5 0.5"
          rotation="30 0 0">
        </a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" atrasar-ocultacao="tempo: 3000"> <!-- Marcador 1 -->
       <a-entity
          gltf-model="#quaresmeiraGLB"
          rotacao-toque="eixoHorizontal: z; eixoVertical: x; velocidade: 0.8"
          position="0.7 0.7 0.1"
          scale="0.5 0.5 0.5"
          rotation="30 0 0">
        </a-entity>
         <a-entity
          gltf-model="#pata_de_vacaGLB"
          rotacao-toque="eixoHorizontal: z; eixoVertical: x; velocidade: 0.8"
          position="-0.7 -0.7 0.1"
          scale="0.5 0.5 0.5"
          rotation="30 0 0">
        </a-entity>
      </a-entity>

    </a-scene>

  </body>
</html>
